# Built as conda env `molssl` on 2026-08-23. Pins are the versions actually installed and smoke-tested
# on 2x Tesla T4 (sm_75, CUDA 12.4). torch comes from the cu124 wheel index, not conda.
name: molssl
channels: [defaults]
dependencies:
  - python=3.11
  - pip
  - pip:
      - --index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - --index-url https://pypi.org/simple
      - torch_geometric==2.6.1
      - rdkit==2024.9.6
      - scikit-learn==1.6.1
      - xgboost==2.1.4
      - pandas==2.2.3
      - numpy==2.1.3
      - pyyaml==6.0.2
      - matplotlib==3.10.0
      - tqdm==4.67.1
      - pytest==8.3.4
