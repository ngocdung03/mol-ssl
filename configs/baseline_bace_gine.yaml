# Supervised GINE baseline on BACE (1513 mols, ADMET-type binary classification).
dataset: BACE
task: classification
n_tasks: 1
split: scaffold
split_frac: [0.8, 0.1, 0.1]
split_manifest: data/splits/bace_scaffold.json
label_budget: 1.0
seeds: [0, 1, 2, 3, 4]
model:
  hidden: 300
  layers: 5
  dropout: 0.1
train:
  epochs: 100
  patience: 20
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 0.0
  amp: fp16
ssl:
  method: none
