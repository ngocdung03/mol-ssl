# The headline experiment: label budget x method x seed. Tox21 is large enough (7831) to sweep low.
dataset: Tox21
task: classification
n_tasks: 12
split: scaffold
split_frac: [0.8, 0.1, 0.1]
split_manifest: data/splits/tox21_scaffold.json
label_budgets: [0.05, 0.10, 0.25, 0.50, 1.00]
seeds: [0, 1, 2, 3, 4]
model:
  hidden: 300
  layers: 5
  dropout: 0.1
train:
  epochs: 100
  batch_size: 32
  lr: 1.0e-3
  amp: fp16
ssl:
  methods: [none, pretrain, contrastive, consistency, pseudolabel]
pool:
  source: zinc250k          # decide at M2: zinc250k | chembl_subset
  max_molecules: 250000     # T4 budget cap
  # filtered against val+test scaffolds of EVERY downstream dataset before writing to disk
  exclude_scaffolds_from:
    - data/splits/tox21_scaffold.json
    - data/splits/bbbp_scaffold.json
    - data/splits/bace_scaffold.json
    - data/splits/lipophilicity_scaffold.json
uncertainty:
  ensemble_seeds: 5
  mc_dropout_passes: 30
  report: [auroc, ece, reliability, selective_accuracy]
